[project]
name = "causal-discovery-final-sepsis"
version = "0.1.0"
description = "PC/FCI causal discovery ensemble over a MIMIC-IV sepsis cohort"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "causal-learn",
    "dowhy>=0.14",
    "ipykernel>=7.2.0",
    "numpy>=2.4.5",
    "pandas>=3.0.3",
    "pgmpy>=1.1.2",
    "pydot>=3.0.1",
    "scikit-learn>=1.5",
    "seaborn>=0.13.2",
]

[tool.uv.sources]
causal-learn = { git = "https://github.com/py-why/causal-learn.git" }

